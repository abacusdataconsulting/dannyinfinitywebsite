<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danny Infinity | Download Your Sheets</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="css/global.css">
    <style>
        .download-container {
            min-height: 100vh;
            padding: 40px 20px;
            max-width: 700px;
            margin: 0 auto;
        }

        .download-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .download-header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .download-subtitle {
            font-size: 0.9rem;
            opacity: 0.6;
            letter-spacing: 1px;
        }

        .download-status {
            text-align: center;
            padding: 60px 20px;
            font-size: 1rem;
            letter-spacing: 2px;
            opacity: 0.6;
        }

        .download-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .download-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            border: 1px solid var(--border-color);
            transition: background 0.15s;
        }

        .download-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .download-item-info {
            flex: 1;
            min-width: 0;
        }

        .download-item-title {
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .download-item-meta {
            font-size: 0.8rem;
            opacity: 0.5;
        }

        .download-item-btn {
            flex-shrink: 0;
            margin-left: 20px;
            padding: 10px 20px;
            border: 2px solid var(--border-color);
            font-size: 0.85rem;
            letter-spacing: 2px;
            transition: all 0.2s ease;
            cursor: pointer;
            background: transparent;
            color: var(--text-primary);
            font-family: inherit;
            text-decoration: none;
        }

        .download-item-btn:hover {
            background: var(--text-primary);
            color: var(--bg-primary);
        }

        .download-all-btn {
            display: block;
            width: 100%;
            text-align: center;
            padding: 18px;
            border: 2px solid var(--border-color);
            font-size: 1rem;
            letter-spacing: 2px;
            font-weight: 600;
            transition: all 0.2s ease;
            cursor: pointer;
            background: transparent;
            color: var(--text-primary);
            font-family: inherit;
            margin-bottom: 20px;
        }

        .download-all-btn:hover {
            background: var(--text-primary);
            color: var(--bg-primary);
        }

        .download-expiry {
            text-align: center;
            font-size: 0.8rem;
            opacity: 0.5;
            letter-spacing: 1px;
            margin-bottom: 40px;
        }

        .download-back {
            display: block;
            text-align: center;
            padding: 12px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .download-back:hover {
            opacity: 1;
        }

        .download-error {
            text-align: center;
            padding: 60px 20px;
        }

        .download-error h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .download-error p {
            opacity: 0.6;
            margin-bottom: 25px;
        }

        /* Account linking section */
        .account-section {
            margin-top: 40px;
            padding: 30px;
            border: 1px solid var(--border-color);
        }

        .account-section h2 {
            font-size: 1.1rem;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-align: center;
        }

        .account-section .account-desc {
            font-size: 0.8rem;
            opacity: 0.6;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .account-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
        }

        .account-tab-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.85rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .account-tab-btn.active {
            background: var(--text-primary);
            color: var(--bg-primary);
        }

        .account-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .account-form input {
            padding: 12px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .account-form input::placeholder {
            opacity: 0.4;
        }

        .account-submit-btn {
            padding: 14px;
            border: 2px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .account-submit-btn:hover {
            background: var(--text-primary);
            color: var(--bg-primary);
        }

        .account-submit-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .account-message {
            text-align: center;
            font-size: 0.85rem;
            padding: 10px;
            letter-spacing: 1px;
        }

        .account-message.success {
            color: #4ade80;
        }

        .account-message.error {
            color: #f87171;
        }

        .account-linked {
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            opacity: 0.7;
        }

        .account-linked strong {
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="download-container">
        <div class="download-header">
            <a href="home.html" class="site-logo" style="margin-bottom:20px;display:block;">DANNY<span class="logo-accent">INFINITY</span></a>
            <h1>Your Downloads</h1>
            <p class="download-subtitle">Thank you for your purchase!</p>
        </div>

        <div id="download-content">
            <div class="download-status" id="download-status">Looking up your purchase...</div>
        </div>

        <div id="account-section-container"></div>

        <a href="sheet-music.html" class="download-back">[BACK TO SHEET MUSIC]</a>
    </div>

    <script>
    (function() {
        'use strict';

        var contentEl = document.getElementById('download-content');
        var statusEl = document.getElementById('download-status');
        var accountContainer = document.getElementById('account-section-container');
        var params = new URLSearchParams(window.location.search);
        var sessionId = params.get('session_id');
        var token = params.get('token');
        var currentDownloadToken = null;

        if (!sessionId && !token) {
            showError('Invalid Link', 'No purchase information found in the URL.');
            return;
        }

        if (token) {
            currentDownloadToken = token;
            loadDownloads(token);
        } else {
            lookupToken(sessionId, 0);
        }

        function lookupToken(sid, attempt) {
            fetch('/api/download/lookup?session_id=' + encodeURIComponent(sid))
                .then(function(res) {
                    if (res.status === 404 && attempt < 5) {
                        statusEl.textContent = 'Confirming your payment...';
                        setTimeout(function() { lookupToken(sid, attempt + 1); }, 2000);
                        return null;
                    }
                    return res.json().then(function(data) {
                        if (!res.ok) throw new Error(data.error || 'Purchase not found');
                        return data;
                    });
                })
                .then(function(data) {
                    if (!data) return;
                    currentDownloadToken = data.token;
                    history.replaceState(null, '', '/download.html?token=' + data.token);
                    loadDownloads(data.token);
                })
                .catch(function(err) {
                    showError('Purchase Not Found', err.message || 'We could not find your purchase. Please check your email for a receipt.');
                });
        }

        function loadDownloads(tkn) {
            statusEl.textContent = 'Loading your files...';

            fetch('/api/download/' + encodeURIComponent(tkn))
                .then(function(res) {
                    return res.json().then(function(data) {
                        if (!res.ok) throw new Error(data.error || 'Download unavailable');
                        return data;
                    });
                })
                .then(function(data) {
                    renderDownloads(data);
                    showAccountSection();
                })
                .catch(function(err) {
                    showError('Download Unavailable', err.message);
                });
        }

        function renderDownloads(data) {
            var html = '<div class="download-list">';

            data.items.forEach(function(item) {
                html +=
                    '<div class="download-item">' +
                        '<div class="download-item-info">' +
                            '<div class="download-item-title">' + esc(item.title) + '</div>' +
                            '<div class="download-item-meta">' + esc(item.composer || 'Danny Infinity') + ' // ' + esc(item.arrangement || '') + '</div>' +
                        '</div>' +
                        '<a href="' + esc(item.downloadUrl) + '" class="download-item-btn">[DOWNLOAD]</a>' +
                    '</div>';
            });

            html += '</div>';

            if (data.items.length > 1) {
                html += '<button class="download-all-btn" id="download-all-btn">[DOWNLOAD ALL]</button>';
            }

            var expiry = new Date(data.expiresAt);
            var now = new Date();
            var hoursLeft = Math.max(0, Math.round((expiry - now) / (1000 * 60 * 60)));
            html += '<div class="download-expiry">Download links expire in ' + hoursLeft + ' hours</div>';

            contentEl.innerHTML = html;

            var downloadAllBtn = document.getElementById('download-all-btn');
            if (downloadAllBtn) {
                downloadAllBtn.addEventListener('click', function() {
                    data.items.forEach(function(item, idx) {
                        setTimeout(function() {
                            var a = document.createElement('a');
                            a.href = item.downloadUrl;
                            a.download = '';
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                        }, idx * 500);
                    });
                });
            }
        }

        // ============================
        // ACCOUNT LINKING SECTION
        // ============================
        function showAccountSection() {
            // Check if already logged in (cookie handles auth)
            var existingUser = localStorage.getItem('userData');

            if (existingUser) {
                // Auto-link the purchase
                linkPurchaseToAccount(JSON.parse(existingUser));
                return;
            }

            accountContainer.innerHTML =
                '<div class="account-section">' +
                    '<h2>Save to Your Account</h2>' +
                    '<p class="account-desc">Create an account or log in to access your purchased sheets anytime — no expiring download links needed.</p>' +
                    '<div class="account-tabs">' +
                        '<button class="account-tab-btn active" id="tab-register">CREATE ACCOUNT</button>' +
                        '<button class="account-tab-btn" id="tab-login">LOG IN</button>' +
                    '</div>' +
                    '<div id="account-form-area">' +
                        renderRegisterForm() +
                    '</div>' +
                    '<div id="account-message"></div>' +
                '</div>';

            // Tab switching
            document.getElementById('tab-register').addEventListener('click', function() {
                this.classList.add('active');
                document.getElementById('tab-login').classList.remove('active');
                document.getElementById('account-form-area').innerHTML = renderRegisterForm();
                document.getElementById('account-message').innerHTML = '';
                bindFormSubmit();
            });

            document.getElementById('tab-login').addEventListener('click', function() {
                this.classList.add('active');
                document.getElementById('tab-register').classList.remove('active');
                document.getElementById('account-form-area').innerHTML = renderLoginForm();
                document.getElementById('account-message').innerHTML = '';
                bindFormSubmit();
            });

            bindFormSubmit();
        }

        function renderRegisterForm() {
            return '<form class="account-form" id="account-form" data-mode="register">' +
                '<input type="text" name="username" placeholder="Choose a username" required minlength="2" autocomplete="username">' +
                '<input type="password" name="password" placeholder="Choose a password" required minlength="8" autocomplete="new-password">' +
                '<button type="submit" class="account-submit-btn">[CREATE ACCOUNT & SAVE PURCHASE]</button>' +
            '</form>';
        }

        function renderLoginForm() {
            return '<form class="account-form" id="account-form" data-mode="login">' +
                '<input type="text" name="username" placeholder="Username" required autocomplete="username">' +
                '<input type="password" name="password" placeholder="Password" required autocomplete="current-password">' +
                '<button type="submit" class="account-submit-btn">[LOG IN & SAVE PURCHASE]</button>' +
            '</form>';
        }

        function bindFormSubmit() {
            var form = document.getElementById('account-form');
            if (!form) return;

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                var mode = form.dataset.mode;
                var username = form.username.value.trim();
                var password = form.password.value;
                var btn = form.querySelector('.account-submit-btn');
                var msgEl = document.getElementById('account-message');

                btn.disabled = true;
                btn.textContent = mode === 'register' ? 'Creating account...' : 'Logging in...';
                msgEl.innerHTML = '';

                var url = mode === 'register' ? '/api/user/register' : '/api/user/login';
                var body = mode === 'register'
                    ? { name: username, password: password }
                    : { name: username, password: password };

                fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                })
                .then(function(res) {
                    return res.json().then(function(data) {
                        if (!res.ok) throw new Error(data.error || 'Failed');
                        return data;
                    });
                })
                .then(function(data) {
                    if (mode === 'register') {
                        // After registration, log in to get token
                        return fetch('/api/user/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name: username, password: password })
                        }).then(function(res) {
                            return res.json().then(function(d) {
                                if (!res.ok) throw new Error(d.error || 'Login failed after registration');
                                return d;
                            });
                        });
                    }
                    return data;
                })
                .then(function(loginData) {
                    // Store user info for UI (session token in httpOnly cookie)
                    localStorage.setItem('userData', JSON.stringify(loginData.user));

                    // Link purchase (cookie sent automatically)
                    linkPurchaseToAccount(loginData.user);
                })
                .catch(function(err) {
                    msgEl.innerHTML = '<div class="account-message error">' + esc(err.message) + '</div>';
                    btn.disabled = false;
                    btn.textContent = mode === 'register' ? '[CREATE ACCOUNT & SAVE PURCHASE]' : '[LOG IN & SAVE PURCHASE]';
                });
            });
        }

        function linkPurchaseToAccount(user) {
            if (!currentDownloadToken) return;

            fetch('/api/user/library/link-purchase', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ downloadToken: currentDownloadToken })
            })
            .then(function(res) {
                return res.json().then(function(data) {
                    if (!res.ok) throw new Error(data.error || 'Link failed');
                    return data;
                });
            })
            .then(function(data) {
                accountContainer.innerHTML =
                    '<div class="account-section">' +
                        '<div class="account-linked">' +
                            'Logged in as <strong>' + esc(user.name) + '</strong><br>' +
                            'Purchase saved to your account. You can access your sheets anytime from the <a href="sheet-music.html" style="text-decoration:underline;">Sheet Music</a> page.' +
                        '</div>' +
                    '</div>';
            })
            .catch(function(err) {
                accountContainer.innerHTML =
                    '<div class="account-section">' +
                        '<div class="account-linked">' +
                            'Logged in as <strong>' + esc(user.name) + '</strong><br>' +
                            '<span style="color:#f87171;">' + esc(err.message) + '</span>' +
                        '</div>' +
                    '</div>';
            });
        }

        function showError(title, message) {
            contentEl.innerHTML =
                '<div class="download-error">' +
                    '<h2>' + esc(title) + '</h2>' +
                    '<p>' + esc(message) + '</p>' +
                '</div>';
        }

        function esc(str) {
            if (str == null) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    })();
    </script>
</body>
</html>
